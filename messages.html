<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сообщения — Вкус здоровья</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2d5f3b">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ВкусЗдоровья">
  <script src="js/theme.js"></script>
  <link rel="preload" href="fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/vendor/supabase.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/db.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/user-search.js"></script>
  <script defer src="js/messages.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="container" style="padding:clamp(20px,4vw,40px) 0 48px">
      <div class="card tool-card hidden" id="dm-need-login">
        <h2 style="font-size:1.5rem">Войдите, чтобы переписываться</h2>
        <p class="muted">Личные сообщения доступны зарегистрированным участникам.</p>
        <a class="btn btn-primary" href="login.html">Войти</a>
      </div>

      <div class="dm-layout hidden" id="dm">
        <aside class="card dm-list">
          <div class="dm-list-head">
            <h1 class="dm-title">Сообщения</h1>
            <button class="btn btn-primary btn-sm" type="button" id="new-group">👥 Новая беседа</button>
          </div>
          <div data-user-search data-mode="dm" data-placeholder="🔍 Найти, кому написать"></div>
          <div id="dm-conversations"><p class="muted small">Загрузка…</p></div>
        </aside>

        <section class="card dm-chat" id="dm-chat">
          <div class="dm-empty muted" id="dm-empty">Выберите диалог слева или создайте беседу</div>
          <div class="dm-chat-inner hidden" id="dm-chat-inner">
            <div class="dm-chat-head">
              <button class="icon-btn dm-back" type="button" id="dm-back" aria-label="Назад к диалогам">←</button>
              <a class="dm-peer" id="dm-peer" href="#"></a>
              <button class="icon-btn hidden" type="button" id="dm-info-btn" aria-label="Участники и настройки беседы" title="Участники">👥</button>
            </div>

            <div class="dm-info hidden" id="dm-info">
              <div class="dm-info-row">
                <form class="dm-rename" id="dm-rename" novalidate>
                  <label class="sr-only" for="dm-rename-input">Название беседы</label>
                  <input class="input" id="dm-rename-input" maxlength="60">
                  <button class="btn btn-ghost btn-sm" type="submit">Сохранить</button>
                </form>
              </div>
              <h3 class="dm-info-title">Участники <span id="dm-members-count"></span></h3>
              <div class="dm-members" id="dm-members"></div>
              <div class="dm-add">
                <p class="small muted">Добавить людей:</p>
                <div data-picker id="dm-add-picker"></div>
                <button class="btn btn-primary btn-sm hidden" type="button" id="dm-add-btn">Добавить</button>
              </div>
              <button class="btn btn-danger btn-sm" type="button" id="dm-leave">Выйти из беседы</button>
            </div>

            <div class="dm-messages" id="dm-messages" aria-live="polite"></div>

            <div class="dm-attach hidden" id="dm-attach"></div>
            <form class="dm-form" id="dm-form" novalidate>
              <label class="icon-btn dm-tool" for="dm-file" title="Фото или файл" aria-label="Прикрепить фото или файл">📎</label>
              <input type="file" id="dm-file" class="sr-only">
              <label class="sr-only" for="dm-input">Сообщение</label>
              <textarea class="textarea" id="dm-input" rows="1" maxlength="4000" placeholder="Сообщение…"></textarea>
              <button class="icon-btn dm-tool" type="button" id="dm-mic" title="Голосовое сообщение" aria-label="Записать голосовое">🎤</button>
              <button class="btn btn-primary" type="submit" aria-label="Отправить">➤</button>
            </form>
            <div class="dm-recording hidden" id="dm-recording">
              <span class="rec-dot" aria-hidden="true"></span>
              <span id="dm-rec-time">0:00</span>
              <span class="small muted">Идёт запись…</span>
              <button class="btn btn-ghost btn-sm" type="button" id="dm-rec-cancel">✕ Отмена</button>
              <button class="btn btn-primary btn-sm" type="button" id="dm-rec-send">➤ Отправить</button>
            </div>
          </div>
        </section>
      </div>

      <dialog class="modal" id="group-modal" aria-labelledby="gm-title">
        <form class="modal-body" id="group-form" method="dialog" novalidate>
          <button class="icon-btn modal-close" type="button" data-close aria-label="Закрыть">✕</button>
          <h2 id="gm-title" style="font-size:1.4rem">Новая беседа</h2>
          <div class="field" style="margin:16px 0">
            <label for="gm-name">Название</label>
            <input class="input" id="gm-name" maxlength="60" placeholder="Например: Марафон «Минус 5 кг»" required>
          </div>
          <div class="field">
            <span class="label">Участники</span>
            <div data-picker id="gm-picker"></div>
          </div>
          <p class="form-error" role="alert"></p>
          <button class="btn btn-primary btn-block" type="submit">Создать беседу</button>
        </form>
      </dialog>

      <div class="img-viewer hidden" id="img-viewer" role="dialog" aria-label="Фото"><img alt=""><button class="lightbox-close" type="button" aria-label="Закрыть">✕</button></div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
