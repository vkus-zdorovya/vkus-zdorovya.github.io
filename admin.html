<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель — Укропчик</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2d5f3b">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script src="js/theme.js"></script>
  <link rel="preload" href="fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/vendor/supabase.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/db.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/admin.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>Админ-панель</h1>
      </div>
    </section>

    <section class="container" style="padding-bottom:64px">
      <!-- не вошёл -->
      <div class="card tool-card hidden" id="need-login">
        <h2 style="font-size:1.5rem">Нужно войти в аккаунт</h2>
        <p class="muted">Админ-панель доступна только вошедшим пользователям, которые знают пароль администратора.</p>
        <a class="btn btn-primary" href="login.html">Войти</a>
      </div>

      <!-- пароль -->
      <form class="card tool-card hidden" id="admin-login" novalidate style="max-width:520px">
        <h2 style="font-size:1.5rem">Вход в админ-панель</h2>
        <p class="muted">Введите пароль администратора. После 5 неверных попыток вход блокируется на 15 минут.</p>
        <p class="form-note warn hidden" id="demo-hint">Демо-режим: пароль <b>admin</b>.</p>
        <div class="field" style="margin:16px 0">
          <label for="admin-pass">Пароль администратора</label>
          <div class="input-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input class="input" id="admin-pass" type="password" autocomplete="off" required>
          </div>
        </div>
        <p class="form-error" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">Войти в админку</button>
      </form>

      <!-- панель -->
      <div class="hidden" id="panel">
        <div class="diet-actions" style="justify-content:space-between;align-items:center">
          <div class="segmented" id="admin-tabs" role="tablist">
            <button type="button" data-tab="overview" class="active">Обзор</button>
            <button type="button" data-tab="users">Пользователи</button>
            <button type="button" data-tab="forum">Форум</button>
            <button type="button" data-tab="messages">Сообщения</button>
          </div>
          <button class="btn btn-ghost btn-sm" type="button" id="admin-exit">Выйти из режима администратора</button>
        </div>

        <div data-pane="overview">
          <div class="result-grid" id="stats"></div>
        </div>

        <div data-pane="users" class="hidden">
          <div class="card">
            <div class="forum-tools"><input class="input" type="search" id="user-search" placeholder="🔍 Поиск по имени или почте"></div>
            <div class="table-wrap" id="users"></div>
          </div>
        </div>

        <div data-pane="forum" class="hidden">
          <div class="posts" id="admin-posts"></div>
        </div>

        <div data-pane="messages" class="hidden">
          <div class="posts" id="messages"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
